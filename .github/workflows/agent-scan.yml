name: AgentScan

on:
  pull_request_target:
    types:
      - opened
      - reopened
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created

jobs:
  agentscan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: AgentScan
        uses: MatteoGabriele/agentscan-action@8112fb79b33fafb8506159df20129a34209ac410
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trusted-author-associations: "member,owner"
